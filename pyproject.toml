[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-chemistry-renderer"
version = "0.1.0"
description = "RDKit-validated classroom structural formulas"
requires-python = ">=3.10"
dependencies = ["rdkit>=2024.3", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chem-render = "chemistry_renderer.__main__:main"

[tool.setuptools.packages.find]
include = ["chemistry_renderer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
